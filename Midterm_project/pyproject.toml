[project]
name = "midterm-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "An0n1msh1k", email = "anonimshik21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "xgboost==2.0.3",
]

[project.scripts]
midterm-project = "midterm_project:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]
